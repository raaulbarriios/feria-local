<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicializar Base de Datos - Feria Algeciras</title>
    <!-- Fuentes tipográficas e iconos premium -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 10px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background-color: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .console {
            margin-top: 30px;
            background-color: #020617;
            border: 1px solid var(--border);
            border-radius: 8px;
            height: 250px;
            overflow-y: auto;
            padding: 15px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            line-height: 1.4;
            display: none;
        }

        .log-item {
            margin-bottom: 6px;
            color: #38bdf8;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .log-item.success {
            color: #4ade80;
        }

        .log-item.error {
            color: #f87171;
        }

        .log-item.info {
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size: 3.5rem; color: var(--primary); margin-bottom: 20px;">
            <i class="fa-solid fa-database"></i>
        </div>
        <h1>Inicializar Base de Datos</h1>
        <p>Este asistente creará las 56 casetas estructuradas (p01 - p56), las etiquetas predefinidas globales y el usuario administrador en tu nuevo proyecto de Firebase.</p>
        
        <button id="initBtn" class="btn">
            <i class="fa-solid fa-play"></i> Iniciar Proceso
        </button>

        <div id="consoleLog" class="console"></div>
    </div>

    <!-- Integración con la configuración existente -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDHAJj-rSSNbywkow7nkGInF171kvdwv_I",
          authDomain: "feria-local-c4ba3.firebaseapp.com",
          projectId: "feria-local-c4ba3",
          storageBucket: "feria-local-c4ba3.firebasestorage.app",
          messagingSenderId: "794529751322",
          appId: "1:794529751322:web:69c26d52f94207093e0ca3",
          measurementId: "G-9L0CNW0D5L"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const btn = document.getElementById('initBtn');
        const consoleLog = document.getElementById('consoleLog');

        function log(msg, type = 'info') {
            const item = document.createElement('div');
            item.className = `log-item ${type}`;
            
            let icon = '<i class="fa-solid fa-chevron-right"></i>';
            if (type === 'success') icon = '<i class="fa-solid fa-circle-check"></i>';
            if (type === 'error') icon = '<i class="fa-solid fa-circle-xmark"></i>';
            if (type === 'info' && msg.includes("Omitiendo")) icon = '<i class="fa-solid fa-angles-right"></i>';
            
            item.innerHTML = `${icon} <span>${msg}</span>`;
            consoleLog.appendChild(item);
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        btn.onclick = async () => {
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Procesando...';
            consoleLog.style.display = 'block';
            consoleLog.innerHTML = '';

            log("🚀 Iniciando la conexión y creación de la base de datos...");
            const sleep = ms => new Promise(res => setTimeout(res, ms));

            try {
                // 1. Crear documento de etiquetas predefinidas
                log("🏷️ Comprobando etiquetas predefinidas...");
                const etiquetasSnap = await getDoc(doc(db, "feria", "etiquetas"));
                if (!etiquetasSnap.exists()) {
                    log("🏷️ Creando etiquetas predefinidas...");
                    await setDoc(doc(db, "feria", "etiquetas"), {
                        predefinidas: ["Pública", "Privada", "Tradicional", "Moderna", "Familiar", "Juvenil", "Comida", "Copas"]
                    });
                    log("Etiquetas globales configuradas.", "success");
                } else {
                    log("🏷️ Las etiquetas globales ya existen. Omitiendo.", "info");
                }
                await sleep(150);

                // 2. Crear las 56 casetas (p01 a p56)
                log("🎪 Comprobando documentos de casetas (p01 - p56)...");
                for (let i = 1; i <= 56; i++) {
                    const id = 'p' + i.toString().padStart(2, '0');
                    
                    const casetaSnap = await getDoc(doc(db, "feria", id));
                    if (casetaSnap.exists()) {
                        log(`Caseta ${id} ya existe. Omitiendo.`, "info");
                        continue;
                    }

                    const nombre = id === "p01" ? "EL PITO" : `Caseta ${i}`;
                    log(`🎪 Inicializando ${id} (${nombre})...`);
                    
                    await setDoc(doc(db, "feria", id), {
                        numero: i.toString(),
                        nombre: nombre,
                        descripcion: "",
                        imagen: "",
                        estatus: true,
                        etiquetas: [],
                        programacion: {
                            "Día 20": [],
                            "Día 21": [],
                            "Día 22": [],
                            "Día 23": [],
                            "Día 24": [],
                            "Día 25": [],
                            "Día 26": [],
                            "Día 27": [],
                            "Día 28": []
                        }
                    });
                    log(`Caseta ${id} inicializada.`, "success");
                    await sleep(150);
                }
                log("Todas las casetas verificadas e inicializadas.", "success");

                // 3. Crear el usuario administrador de prueba (UID asignado a caseta p01)
                log("👤 Comprobando vinculación de usuario...");
                const userSnap = await getDoc(doc(db, "usuario", "Xog28SLQYnROqv4DlKrZcPWZLz23"));
                if (!userSnap.exists()) {
                    log("👤 Vinculando usuario raulbarrios@gmail.com...");
                    await setDoc(doc(db, "usuario", "Xog28SLQYnROqv4DlKrZcPWZLz23"), {
                        casetaId: "p01",
                        email: "raulbarrios@gmail.com"
                    });
                    log("Usuario vinculado a caseta p01 correctamente.", "success");
                } else {
                    log("👤 Usuario ya vinculado. Omitiendo.", "info");
                }

                log("🎉 ¡El proceso de inicialización ha terminado con éxito!", "success");
                btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Completado';
            } catch (error) {
                log(`Error durante el proceso: ${error.message}`, "error");
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Reintentar';
            }
        };
    </script>
</body>
</html>
